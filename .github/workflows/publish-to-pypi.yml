name: 发布Python包到PyPI

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pypi
    # 添加权限设置，这对OIDC身份验证是必需的
    permissions:
      id-token: write # 用于OIDC身份验证
      contents: read # 用于检出代码

    steps:
      - uses: actions/checkout@v3

      - name: 设置Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: 构建包
        run: |
          python -m build

      - name: 使用Trusted Publisher发布到PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # 不再需要凭据，因为我们使用Trusted Publisher
        # 如果需要发布到TestPyPI，可以取消注释下面的行
        # with:
        #   repository-url: https://test.pypi.org/legacy/
