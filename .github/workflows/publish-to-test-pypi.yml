name: 发布Python包到TestPyPI

on:
  push:
    tags:
      - "v*-beta*" # 匹配测试版本标签，例如v0.3.0-beta1

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 添加权限设置，这对OIDC身份验证是必需的
    permissions:
      id-token: write # 用于OIDC身份验证
      contents: read # 用于检出代码

    steps:
      - uses: actions/checkout@v3

      - name: 设置Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: 构建包
        run: |
          python -m build

      - name: 使用Trusted Publisher发布到TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
